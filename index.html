<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Chatbot</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f4f7;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 95%;
      max-width: 500px;
      height: 90vh;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: #2563eb;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .header h2 {
      margin-bottom: 5px;
    }

    .header p {
      font-size: 13px;
      opacity: 0.9;
    }

    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #f8fafc;
    }

    .message {
      display: flex;
      margin-bottom: 15px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 75%;
      padding: 12px 15px;
      border-radius: 15px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .bot .bubble {
      background: #e5e7eb;
      color: #111827;
      border-bottom-left-radius: 4px;
    }

    .user .bubble {
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .input-area {
      display: flex;
      padding: 12px;
      border-top: 1px solid #ddd;
      background: white;
      gap: 8px;
    }

    #userInput {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 25px;
      outline: none;
      font-size: 15px;
    }

    #sendButton {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 18px;
    }

    #sendButton:hover {
      background: #1d4ed8;
    }

    .typing {
      font-size: 13px;
      color: #777;
      margin-bottom: 10px;
      display: none;
    }

    @media (max-width: 600px) {
      .chat-container {
        width: 100%;
        height: 100vh;
        border-radius: 0;
      }
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <div class="header">
      <h2>🤖 My Chatbot</h2>
      <p>Ask me anything!</p>
    </div>

    <div class="chat-box" id="chatBox">

      <div class="message bot">
        <div class="bubble">
          Hello! 👋<br>
          I'm your chatbot. How can I help you?
        </div>
      </div>

      <div class="typing" id="typing">
        Bot is typing...
      </div>

    </div>

    <div class="input-area">
      <input
        type="text"
        id="userInput"
        placeholder="Type your message..."
        autocomplete="off"
      >

      <button id="sendButton">➤</button>
    </div>

  </div>

  <script>
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendButton = document.getElementById("sendButton");
    const typing = document.getElementById("typing");

    function addMessage(message, sender) {

      const messageDiv = document.createElement("div");
      messageDiv.className = "message " + sender;

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      bubble.textContent = message;

      messageDiv.appendChild(bubble);

      chatBox.insertBefore(messageDiv, typing);

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function getBotResponse(message) {

      message = message.toLowerCase();

      if (message.includes("hello") ||
          message.includes("hi") ||
          message.includes("hey")) {

        return "Hello! 👋 Nice to meet you!";
      }

      if (message.includes("how are you")) {
        return "I'm doing great! 😊 How can I help you?";
      }

      if (message.includes("name")) {
        return "I'm My Chatbot 🤖";
      }

      if (message.includes("github")) {
        return "GitHub Pages can host your HTML, CSS and JavaScript website for free!";
      }

      if (message.includes("help")) {
        return "Sure! You can ask me about GitHub, websites, HTML, CSS or JavaScript.";
      }

      if (message.includes("bye")) {
        return "Goodbye! 👋 Have a great day!";
      }

      return "I'm still a simple chatbot, so I don't know the answer to that yet. 🤔";
    }

    function sendMessage() {

      const message = userInput.value.trim();

      if (message === "") {
        return;
      }

      addMessage(message, "user");

      userInput.value = "";

      typing.style.display = "block";

      setTimeout(() => {

        typing.style.display = "none";

        const response = getBotResponse(message);

        addMessage(response, "bot");

      }, 800);
    }

    sendButton.addEventListener("click", sendMessage);

    userInput.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        sendMessage();
      }

    });
  </script>

</body>
</html>
